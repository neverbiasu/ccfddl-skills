name: upstream-parity
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Clone upstream ccf-deadlines main
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/ccfddl/ccf-deadlines.git upstream
          git -C upstream sparse-checkout set conference extensions/cli
          git -C upstream log --oneline -1
      - run: pip install -e ".[dev]" -r upstream/extensions/cli/req.txt
      - name: Parity with the official CLI
        env:
          CCFDDL_UPSTREAM: ${{ github.workspace }}/upstream
        run: python -m pytest -v tests/python/test_upstream_parity.py
